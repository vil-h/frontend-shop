name: Проверка доступности КР №3

on:
  push:
    branches:
      - kr3-responsive
    paths:
      - .github/workflows/kr3-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Скачать рабочую ветку
        uses: actions/checkout@v4
        with:
          ref: kr3-responsive
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Подготовить браузер и аудит
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          npm install --no-save --no-package-lock lighthouse@13.6.0 puppeteer-core@24
          mkdir -p lighthouse audit-screenshots
      - name: Запустить локальный сайт
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/kr3-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kr3-http.log
          exit 1
      - name: Проверить пять страниц на пяти ширинах
        shell: bash
        run: |
          cat > audit-viewport.cjs <<'JAVASCRIPT'
          const puppeteer = require('puppeteer-core');
          const fs = require('node:fs');
          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME_PATH,
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });
            const pages = ['index', 'catalog', 'product', 'order', 'contacts'];
            const widths = [360, 430, 768, 1024, 1440];
            const results = [];
            try {
              for (const name of pages) {
                for (const width of widths) {
                  const page = await browser.newPage();
                  await page.setViewport({width, height: 900, deviceScaleFactor: 1});
                  const response = await page.goto('http://127.0.0.1:8000/' + name + '.html', {waitUntil: 'load'});
                  const actual = await page.evaluate(() => ({
                    viewport: window.innerWidth,
                    documentWidth: document.documentElement.scrollWidth,
                    bodyWidth: document.body.scrollWidth,
                    h1: document.querySelectorAll('h1').length,
                    navPresent: !!document.querySelector('nav'),
                    imagesOutside: [...document.images].filter(img => {
                      const r = img.getBoundingClientRect();
                      return r.width > 0 && (r.right > innerWidth + 1 || r.left < -1);
                    }).length
                  }));
                  const check = {
                    page: name + '.html',
                    width,
                    status: response.status(),
                    ...actual,
                    horizontalOverflow: actual.documentWidth > width + 1,
                  };
                  results.push(check);
                  console.log(JSON.stringify(check));
                  await page.screenshot({path: 'audit-screenshots/' + name + '-' + width + '.png', fullPage: true});
                  await page.close();
                }
              }
            } finally {
              await browser.close();
            }
            fs.writeFileSync('lighthouse/responsive-check.json', JSON.stringify(results, null, 2) + '\n');
            const errors = results.filter(x => x.status !== 200 || x.h1 !== 1 || x.horizontalOverflow || x.imagesOutside);
            console.log('Проверено комбинаций: ' + results.length + '; замечаний: ' + errors.length);
            if (errors.length) console.log('Замечания: ' + JSON.stringify(errors));
          })().catch(e => {console.error(e); process.exit(1);});
          JAVASCRIPT
          node audit-viewport.cjs
      - name: Запустить настоящий Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          for page in index catalog order; do
            npx --no-install lighthouse "http://127.0.0.1:8000/$page.html" \
              --only-categories=accessibility \
              --output=html --output=json \
              --output-path="lighthouse/$page" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --quiet
            mv "lighthouse/$page.report.html" "lighthouse/$page-accessibility.html"
            node -e "const r=require('./lighthouse/$page.report.json'); console.log('$page: Accessibility = '+Math.round(r.categories.accessibility.score*100));"
          done
      - name: Сохранить файлы проверки как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr3-lighthouse-and-viewport
          path: |
            lighthouse/
            audit-screenshots/
          retention-days: 7
          if-no-files-found: warn
      - name: Записать настоящие результаты в рабочую ветку
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lighthouse/index-accessibility.html lighthouse/catalog-accessibility.html lighthouse/order-accessibility.html lighthouse/responsive-check.json
          git commit -m "Добавлены настоящие отчёты Lighthouse и проверка экранов [skip ci]"
          git push origin HEAD:kr3-responsive
